name: Platform-test
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.9"
          python-version: "3.14"
          working-directory: backend
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --locked installs exactly what uv.lock pins and fails if it has drifted from pyproject.toml,
      # so CI can't silently test newer versions than the ones run locally.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy .

  test:
    runs-on: ubuntu-latest
    # Same digests as docker-compose.yml, so CI tests the images production runs. Dependabot's
    # github-actions updater only bumps `uses:` lines, not these: when it moves the compose
    # digests, copy them here in the same PR.
    services:
      database:
        image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.9"
          python-version: "3.14"
          working-directory: backend
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('backend/app/core/config.py') }}
          restore-keys: |
            hf-

      - name: Run test
        run: pytest -q

      # Proves the ORM models and the migration chain have not silently diverged. pytest cannot
      # catch this: conftest builds its database from migrations, so a model-only change is
      # invisible until something queries the missing column at runtime.
      - name: Check model/migration parity
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-not-real-000000000000000000
        run: |
          alembic upgrade head
          alembic check

      # Proves the worker boots, reaches the broker and completes a job; pytest runs task code
      # in-process and cannot catch a broken worker entrypoint or broker URL.
      - name: Worker smoke test
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          SECRET_KEY: ci-secret-not-real-000000000000000000
        run: |
          celery -A app.workers.celery_app worker --loglevel=warning &
          python scripts/worker_smoke.py --timeout 60

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test

      # No BACKEND_ORIGIN needed: next.config.ts falls back to localhost. The rewrites ARE baked
      # in at build time, so this build artifact is only good for a localhost backend.
      - name: Build
        run: npm run build
