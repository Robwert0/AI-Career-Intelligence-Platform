name: Platform-test
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.9"
          python-version: "3.14"
          working-directory: backend
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --locked installs exactly what uv.lock pins and fails if it has drifted from pyproject.toml,
      # so CI can't silently test newer versions than the ones run locally.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy .

  test:
    runs-on: ubuntu-latest
    services:
      database:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.9"
          python-version: "3.14"
          working-directory: backend
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('backend/app/core/config.py') }}
          restore-keys: |
            hf-

      - name: Run test
        run: pytest -q

      # Proves the ORM models and the migration chain have not silently diverged. pytest cannot
      # catch this: conftest builds its database from migrations, so a model-only change is
      # invisible until something queries the missing column at runtime.
      - name: Check model/migration parity
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-not-real-000000000000000000
          CV_DOCUMENT_ID: 44444444-4444-4444-4444-444444444444
        run: |
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test

      # No BACKEND_ORIGIN needed: next.config.ts falls back to localhost and rewrites are
      # evaluated per request at runtime, not baked in at build time.
      - name: Build
        run: npm run build
