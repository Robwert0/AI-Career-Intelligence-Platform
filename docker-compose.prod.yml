# Production override for the single-VPS deploy. Put
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
# in the server's .env so every bare `docker compose …` (up, run, exec) includes this file.
# Only Caddy is published (80 and 443, with a Let's Encrypt certificate for DOMAIN); the frontend,
# API, Postgres and Redis are reachable on the compose networks alone. `!reset` needs Docker
# Compose 2.24 or newer.
#
# Memory caps, so one runaway container is OOM-killed (and restarted) instead of the kernel picking
# a victim on a 4 GB host. They add up to 3488 MiB of the ~3.8 GiB such a VPS reports, leaving
# ~350 MiB for the kernel and dockerd even if every container sat at its cap at once; typical use
# is under half of it. Sized from the working set measured 2026-10-15 after a full CV analysis
# (anonymous memory; page cache inside a container is reclaimed before anything is OOM-killed):
#   api 457 MiB (embedding model loaded) · worker 525 MiB (model loaded) · beat 399 MiB
#   frontend 55 MiB · caddy 17 MiB · database 17 MiB on a near-empty DB · redis 9 MiB
# The worker cap assumes concurrency 1 (celery_app.py): model, plus one parse child capped at 512 MB
# of address space (doc_sandbox.PARSE_MEMORY_BYTES), plus its 72 MiB healthcheck process, plus /tmp.
# More concurrency, a second worker or a bigger embedding model means raising it and rechecking the
# sum. `docker compose run` one-offs inherit their service's cap: ingest_cv.py peaked at 546 MiB.

services:
  api:
    mem_limit: 640m

  worker:
    mem_limit: 1280m

  beat:
    # Idle all day, but it imports the whole app (torch included) to read the schedule.
    mem_limit: 512m

  frontend:
    ports: !reset []
    mem_limit: 192m

  database:
    ports: !reset []
    # shared_buffers is Postgres's default 128 MB; the rest is per-connection memory and pg_dump.
    mem_limit: 384m
    restart: unless-stopped

  redis:
    ports: !reset []
    # Same no-persistence flags as dev. noeviction is Redis's default, pinned because the rate
    # limiter depends on it: an evicted bucket is reborn full. maxmemory turns a memory leak or a
    # flood of queued CVs into refused writes (the limiter fails closed) instead of the kernel
    # OOM-killing something else on a 4 GB host. A full queue (MATCH_MAX_QUEUED_ANALYSES=20) at
    # MAX_UPLOAD_MB=5 is ~100 MB of CVs; buckets and job records are tiny.
    # Raising either setting means raising maxmemory and mem_limit with it.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    # Headroom over maxmemory for allocator fragmentation and client buffers.
    mem_limit: 384m
    restart: unless-stopped

  caddy:
    # Caddy sets its Go GOMEMLIMIT from this cap at startup.
    mem_limit: 96m
    ports: !override
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    environment:
      # Required: without it Caddy serves `localhost` from its internal CA and no browser trusts it.
      DOMAIN: ${DOMAIN:?set DOMAIN to the public hostname in .env}
      # One year, fixed here so a dev .env (HSTS_MAX_AGE=0) cannot switch it off. No
      # includeSubDomains or preload: those would bind every other subdomain too.
      HSTS_MAX_AGE: "31536000"
