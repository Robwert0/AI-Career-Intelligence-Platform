# Production override for the single-VPS deploy:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Only Caddy is published (80 and 443, with a Let's Encrypt certificate for DOMAIN); the frontend,
# API, Postgres and Redis are reachable on the compose networks alone. `!reset` needs Docker
# Compose 2.24 or newer.

services:
  database:
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []
    # Same no-persistence flags as dev. noeviction is Redis's default, pinned because the rate
    # limiter depends on it: an evicted bucket is reborn full.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped

  frontend:
    ports: !reset []

  caddy:
    environment:
      # Required: without it Caddy serves `localhost` from its internal CA and no browser trusts it.
      DOMAIN: ${DOMAIN:?set DOMAIN to the public hostname in .env}
      # One year. No includeSubDomains or preload: those would bind every other subdomain too.
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
