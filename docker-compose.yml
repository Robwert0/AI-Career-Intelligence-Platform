# Our own images run as an unprivileged user and need no Linux capabilities at all. The root
# filesystem is read-only: whatever a service must write goes to a named volume or a tmpfs, which
# counts against the container's memory limit.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true

# Python's tempfile, FastAPI spooling uploads over 1 MB, and the ingest one-off's /tmp/cv.pdf.
x-backend-tmp: &backend-tmp
  tmpfs:
    - /tmp:size=64m

services:
  database:
    image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Loopback only: a published port bypasses host firewalls such as UFW. Docker Desktop still
    # forwards 127.0.0.1 ports into WSL2, so host-side tests reach them as before.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    # No RDB/AOF: job records and CV bytes must never be written to disk.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5

  # Everything below runs only with a bare `docker compose up`; `up -d database redis` ignores it.

  migrate:
    <<: [*hardening, *backend-tmp]
    image: career-intel-backend
    build: ./backend
    env_file: ${APP_ENV_FILE:-.env}
    environment: &backend-env
      # The root .env is written for host processes (localhost URLs); inside the network the
      # services are reached by name. POSTGRES_PASSWORD goes in unencoded (see .env.example).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      # Separate name so the host-side OLLAMA_BASE_URL in .env keeps working for local uvicorn.
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    <<: [*hardening, *backend-tmp]
    image: career-intel-backend
    build: ./backend
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      <<: *backend-env
      # uvicorn reads this itself and takes the client from X-Forwarded-For only when the TCP
      # peer is listed here. Only the frontend: Caddy overwrites the header with the real client
      # IP and Next passes it on untouched. Set in compose, so a value in .env cannot widen it.
      FORWARDED_ALLOW_IPS: ${FRONTEND_PROXY_IP:-10.254.253.10}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - api_proxy
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  worker:
    <<: [*hardening, *backend-tmp]
    image: career-intel-backend
    build: ./backend
    env_file: ${APP_ENV_FILE:-.env}
    environment: *backend-env
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Reporting only: plain Compose does not restart an unhealthy container, just an exited one.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Exactly one beat process: none means the retention purge never runs, two run it twice.
  # The fixed container_name prevents a second beat container: `--scale beat=2` is refused.
  beat:
    <<: [*hardening, *backend-tmp]
    container_name: ${COMPOSE_PROJECT_NAME}-beat
    image: career-intel-backend
    build: ./backend
    env_file: ${APP_ENV_FILE:-.env}
    environment: *backend-env
    command: ["celery", "-A", "app.workers.beat_app:beat_app", "beat", "--loglevel=info", "--schedule", "/var/lib/celerybeat/schedule"]
    volumes:
      - celerybeat:/var/lib/celerybeat
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    <<: *hardening
    # Next writes its image-optimizer and fetch caches here; uid 1000 is the image's node user.
    tmpfs:
      - /app/.next/cache:size=64m,uid=1000,gid=1000
    image: career-intel-frontend
    build:
      context: ./frontend
      # Inlined at build time: change them in .env, then `docker compose build frontend`.
      args:
        BACKEND_ORIGIN: http://api:8000
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
        NEXT_PUBLIC_UMAMI_DOMAINS: ${NEXT_PUBLIC_UMAMI_DOMAINS:-}
        NEXT_PUBLIC_UMAMI_DASHBOARD_URL: ${NEXT_PUBLIC_UMAMI_DASHBOARD_URL:-}
    # Loopback only, for local development. This port bypasses Caddy, and the API trusts
    # whatever X-Forwarded-For reaches it through the frontend, so it must never be public:
    # the production override unpublishes it. The same holds for anything joining `edge`.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      edge: {}
      api_proxy:
        ipv4_address: ${FRONTEND_PROXY_IP:-10.254.253.10}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  caddy:
    <<: *hardening
    # The image grants /usr/bin/caddy cap_net_bind_service as a file capability; with it missing
    # from the bounding set the kernel refuses to exec the binary at all.
    cap_add:
      - NET_BIND_SERVICE
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-0}
    # Loopback in development; the production override publishes these on every interface.
    ports:
      - "127.0.0.1:${CADDY_HTTP_PORT:-80}:80"
      - "127.0.0.1:${CADDY_HTTPS_PORT:-443}:443"
      - "127.0.0.1:${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys: losing them means re-issuing, and Let's Encrypt
      # rate-limits that.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped


# Three networks so each hop sees only its neighbour: Caddy reaches only the frontend, and the
# frontend reaches only the API. api_proxy has a fixed subnet because the API trusts
# X-Forwarded-For from one address, the frontend's. FRONTEND_PROXY_IP must sit inside
# API_PROXY_SUBNET: `config` does not check it, Docker only rejects it when it creates the frontend
# container, after the services before it have started. The fixed address means one frontend
# replica.
networks:
  default:
  edge:
  api_proxy:
    ipam:
      config:
        - subnet: ${API_PROXY_SUBNET:-10.254.253.0/28}

volumes:
  pgdata:
  celerybeat:
  caddy_data:
  caddy_config:
