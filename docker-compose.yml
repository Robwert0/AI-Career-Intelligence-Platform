services:
  database:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    # No RDB/AOF: job records and CV bytes must never be written to disk.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5

  # Everything below runs only with a bare `docker compose up`; `up -d database redis` ignores it.

  migrate:
    image: career-intel-backend
    build: ./backend
    env_file: ${APP_ENV_FILE:-.env}
    environment: &backend-env
      # The root .env is written for host processes (localhost URLs); inside the network the
      # services are reached by name. The password goes into the URL unencoded: keep it alphanumeric.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      # Separate name so the host-side OLLAMA_BASE_URL in .env keeps working for local uvicorn.
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    image: career-intel-backend
    build: ./backend
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      <<: *backend-env
      # uvicorn reads this itself. Next's rewrite proxy forwards the client's X-Forwarded-For
      # untouched, so trusting the frontend lets any visitor pick their own rate-limit key.
      # Raise it only once a reverse proxy that overwrites X-Forwarded-For fronts Next.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  worker:
    image: career-intel-backend
    build: ./backend
    env_file: ${APP_ENV_FILE:-.env}
    environment: *backend-env
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Exactly one beat process: none means the retention purge never runs, two run it twice.
  # Never scale this service.
  beat:
    image: career-intel-backend
    build: ./backend
    env_file: ${APP_ENV_FILE:-.env}
    environment: *backend-env
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info", "--schedule", "/var/lib/celerybeat/schedule"]
    volumes:
      - celerybeat:/var/lib/celerybeat
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: career-intel-frontend
    build:
      context: ./frontend
      # Inlined at build time: change them in .env, then `docker compose build frontend`.
      args:
        BACKEND_ORIGIN: http://api:8000
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
        NEXT_PUBLIC_UMAMI_DOMAINS: ${NEXT_PUBLIC_UMAMI_DOMAINS:-}
        NEXT_PUBLIC_UMAMI_DASHBOARD_URL: ${NEXT_PUBLIC_UMAMI_DASHBOARD_URL:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped


volumes:
  pgdata:
  celerybeat:
